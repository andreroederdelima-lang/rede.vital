name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format check (prettier) — informational
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Prettier check (não bloqueia, apenas reporta)
        run: pnpm run format:check || true

  typecheck:
    name: TypeScript check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: tsc --noEmit
        run: pnpm run check

  test:
    # Atualmente 30/49 testes falham por dívida técnica pré-existente:
    # mocks de storage faltando após PR #10 (Forge→S3) e ausência de seed de DB.
    # Mantido informational até serem corrigidos.
    name: Tests (vitest) — informational
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rede_vital_test
          MYSQL_USER: vital
          MYSQL_PASSWORD: vital
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-not-for-prod
      DATABASE_URL: mysql://vital:vital@127.0.0.1:3306/rede_vital_test
      BUILT_IN_FORGE_API_URL: http://localhost/forge
      BUILT_IN_FORGE_API_KEY: ci-fake-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Vitest
        run: pnpm run test || true

  build:
    name: Build (vite + esbuild)
    runs-on: ubuntu-latest
    needs: [typecheck]
    # gate duro — se build falha, PR não merge
    env:
      JWT_SECRET: ci-build-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
